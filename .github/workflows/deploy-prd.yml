name: Deploy to Tomcat(PRD)

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean bootWar -x test

      - name: Verify WAR artifact
        run: |
          set -euo pipefail
          mapfile -t WAR_FILES < <(find build/libs -maxdepth 1 -name '*.war' ! -name '*-plain.war' -type f)
          if [ "${#WAR_FILES[@]}" -eq 0 ]; then
            echo "::error::No deployable WAR found in build/libs"
            ls -la build/libs || true
            exit 1
          fi
          if [ "${#WAR_FILES[@]}" -gt 1 ]; then
            echo "::error::Multiple deployable WAR files found in build/libs"
            printf '%s\n' "${WAR_FILES[@]}"
            exit 1
          fi
          WAR_FILE="${WAR_FILES[0]}"
          echo "WAR_FILE=$WAR_FILE" >> "$GITHUB_ENV"
          mkdir -p deploy
          cp "$WAR_FILE" deploy/opp.war
          ls -lh deploy/opp.war

      - name: Transfer WAR to server via SCP
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.PRD_SERVER_HOST }}
          username: ${{ secrets.PRD_SERVER_USER }}
          key: ${{ secrets.PRD_SERVER_SSH_KEY }}
          source: deploy/opp.war
          target: /usr/share/tomcat/webapps
          strip_components: 1
          overwrite: true

      - name: Deploy to Tomcat and Restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRD_SERVER_HOST }}
          username: ${{ secrets.PRD_SERVER_USER }}
          key: ${{ secrets.PRD_SERVER_SSH_KEY }}
          script: |
            set -euo pipefail

            DEPLOY_DIR=/home/ubuntu/deploy
            WAR_FILE="${DEPLOY_DIR}/opp.war"
            TOMCAT_WEBAPPS=/usr/share/tomcat/webapps

            if [ ! -f "$WAR_FILE" ]; then
              echo "ERROR: WAR not found at ${WAR_FILE}"
              find "$DEPLOY_DIR" -type f 2>/dev/null || true
              exit 1
            fi

            echo "Deploying $(ls -lh "$WAR_FILE")"

            #sudo systemctl stop tomcat
            sudo rm -rf "${TOMCAT_WEBAPPS}/opp" "${TOMCAT_WEBAPPS}/opp.war"
            sudo cp "$WAR_FILE" "${TOMCAT_WEBAPPS}/opp.war"
            rm -f "$WAR_FILE"
            #sudo systemctl start tomcat
            #sudo systemctl is-active --quiet tomcat

            echo "Tomcat is running with new deployment"
