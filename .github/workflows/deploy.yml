name: Deploy to Tomcat

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Verify WAR artifact
        run: |
          set -euo pipefail
          WAR_COUNT=$(find build/libs -maxdepth 1 -name '*.war' -type f | wc -l)
          if [ "$WAR_COUNT" -eq 0 ]; then
            echo "::error::No WAR file found in build/libs"
            ls -la build/libs || true
            exit 1
          fi
          if [ "$WAR_COUNT" -gt 1 ]; then
            echo "::error::Multiple WAR files found in build/libs"
            find build/libs -maxdepth 1 -name '*.war' -type f
            exit 1
          fi
          WAR_FILE=$(find build/libs -maxdepth 1 -name '*.war' -type f -print -quit)
          echo "WAR_FILE=$WAR_FILE" >> "$GITHUB_ENV"
          mkdir -p deploy
          cp "$WAR_FILE" deploy/ROOT.war
          ls -lh deploy/ROOT.war

      - name: Transfer WAR to server via SCP
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: deploy/ROOT.war
          target: /home/ubuntu/deploy
          strip_components: 1
          overwrite: true

      - name: Deploy to Tomcat and Restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail

            DEPLOY_DIR=/home/ubuntu/deploy
            WAR_FILE="${DEPLOY_DIR}/ROOT.war"
            TOMCAT_WEBAPPS=/opt/tomcat/latest/webapps

            if [ ! -f "$WAR_FILE" ]; then
              echo "ERROR: WAR not found at ${WAR_FILE}"
              find "$DEPLOY_DIR" -type f 2>/dev/null || true
              exit 1
            fi

            echo "Deploying $(ls -lh "$WAR_FILE")"

            sudo systemctl stop tomcat
            sudo rm -rf "${TOMCAT_WEBAPPS}/ROOT" "${TOMCAT_WEBAPPS}/ROOT.war"
            sudo cp "$WAR_FILE" "${TOMCAT_WEBAPPS}/ROOT.war"
            rm -f "$WAR_FILE"
            sudo systemctl start tomcat
            sudo systemctl is-active --quiet tomcat

            echo "Tomcat is running with new deployment"
