name: Deploy to Tomcat

on:
  push:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew clean build -x test

    - name: Transfer WAR to server via SCP
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        source: "build/libs/*.war"
        target: "/home/ubuntu/deploy"
        strip_components: 2

    - name: Deploy to Tomcat and Restart
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          sudo systemctl stop tomcat
          sudo rm -rf /opt/tomcat/latest/webapps/ROOT
          sudo cp /home/ubuntu/deploy/*.war /opt/tomcat/latest/webapps/ROOT.war
          rm -rf /home/ubuntu/deploy
          sudo systemctl start tomcat
