name: Deploy to Tomcat

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew clean build -x test

    - name: Transfer WAR to server via SCP
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        source: "build/libs/*.war"
        target: "/home/ubuntu/deploy"
        strip_components: 2

    - name: Deploy to Tomcat and Restart
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          # 1. 기존의 ROOT 디렉토리 및 WAR 백업/삭제 (충돌 방지)
          sudo rm -rf /opt/tomcat/latest/webapps/ROOT
          
          # 2. 톰캣 webapps 경로로 빌드된 WAR 파일 복사 (ROOT.war로 이름 변경하여 루트 경로에서 서비스)
          sudo cp /home/ubuntu/deploy/*.war /opt/tomcat/latest/webapps/ROOT.war
          
          # 3. 임시 배포 폴더 정리
          rm -rf /home/ubuntu/deploy
          
          # 4. (필요 시 주석 해제) 톰캣 서비스 재시작
          # sudo systemctl restart tomcat
